---
- name: Download kubectl binary
  ansible.builtin.get_url:
    url: https://dl.k8s.io/release/v1.35.5/bin/linux/amd64/kubectl
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Fetch kubeconfig from VM
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  delegate_to: 192.168.1.225
  register: k3s_kubeconfig

- name: Create .kube directory on Proxmox host
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Write kubeconfig to Proxmox host
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig.content | b64decode | replace('127.0.0.1', '192.168.1.225') }}"
    dest: /root/.kube/config
    mode: "0600"

- name: Download Helm binary
  ansible.builtin.get_url:
    url: https://get.helm.sh/helm-v3.21.0-linux-amd64.tar.gz
    dest: /tmp/helm.tar.gz
    mode: "0644"

- name: Extract Helm binary
  ansible.builtin.unarchive:
    src: /tmp/helm.tar.gz
    dest: /tmp
    remote_src: true

- name: Install Helm binary
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: "0755"
    remote_src: true