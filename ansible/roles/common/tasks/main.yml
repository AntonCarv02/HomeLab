---
- name: Update and upgrade apt packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install required base packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - ufw
      - fail2ban
    state: present

- name: Set UFW default inbound policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outbound policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow Kubernetes API
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp

- name: Allow WireGuard
  community.general.ufw:
    rule: allow
    port: "51820"
    proto: udp

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present

- name: Set SSH PermitRootLogin to prohibit-password
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin prohibit-password"
    state: present

- name: Restart SSH service
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Set DNS server
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 8.8.8.8
      nameserver 8.8.4.4
    mode: "0644"

