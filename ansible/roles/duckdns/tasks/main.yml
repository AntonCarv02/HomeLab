---
- name: Create DuckDNS update script
  ansible.builtin.copy:
    dest: /usr/local/bin/duckdns_update.sh
    content: |
      #!/bin/bash
      curl -s "https://www.duckdns.org/update?domains=antonyhomelab&token={{ duckdns_token }}&ip=" > /var/log/duckdns.log 2>&1
    mode: "0755"

- name: Set up cron job for DuckDNS update every 5 minutes
  ansible.builtin.cron:
    name: "DuckDNS IP update"
    minute: "*/5"
    job: "/usr/local/bin/duckdns_update.sh"
    user: root
