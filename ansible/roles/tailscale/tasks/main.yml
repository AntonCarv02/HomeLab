---
- name: Download Tailscale install script
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Add Tailscale apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main
    mode: "0644"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Enable and start tailscaled service
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started

- name: Wait for tailscaled socket
  ansible.builtin.wait_for:
    path: /var/run/tailscale/tailscaled.sock
    timeout: 10

- name: Authenticate Tailscale
  ansible.builtin.command: tailscale up --authkey={{ tailscale_auth_key }} --accept-routes --advertise-routes=192.168.1.0/24 --accept-dns=false

